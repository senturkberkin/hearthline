name: Deploy website

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: design-preview/package-lock.json
      - run: npm ci --prefix design-preview
      - run: npm test
      - run: GITHUB_PAGES=true npm run build
      - name: Prepare direct-link pages
        run: |
          mkdir -p design-preview/dist/setup design-preview/dist/results design-preview/dist/privacy design-preview/dist/terms
          cp design-preview/dist/index.html design-preview/dist/setup/index.html
          cp design-preview/dist/index.html design-preview/dist/results/index.html
          cp design-preview/dist/index.html design-preview/dist/privacy/index.html
          cp design-preview/dist/index.html design-preview/dist/terms/index.html
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: design-preview/dist
      - uses: actions/deploy-pages@v4
        id: deployment
