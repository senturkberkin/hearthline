name: Refresh official rent reference
on:
  schedule:
    # TÜİK updates this monthly. Check twice a month, 15 days apart, shortly
    # after the usual monthly publication window.
    - cron: '17 8 4,19 * *'
  workflow_dispatch:
permissions:
  contents: write
  pages: write
  id-token: write
jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      changed: ${{ steps.commit.outputs.changed }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node scripts/update-rent-reference.mjs
      - name: Commit changed official data
        id: commit
        run: |
          if git diff --quiet -- rent-reference.json design-preview/public/rent-reference.json; then
            echo 'changed=false' >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add rent-reference.json design-preview/public/rent-reference.json
          git commit -m 'Update TÜİK rent reference'
          git push
          echo 'changed=true' >> "$GITHUB_OUTPUT"
  deploy:
    needs: refresh
    if: needs.refresh.outputs.changed == 'true'
    uses: ./.github/workflows/deploy-pages.yml
