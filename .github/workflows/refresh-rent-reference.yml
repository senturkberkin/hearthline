name: Refresh official rent reference
on:
  schedule:
    - cron: '25 8 * * *'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node scripts/update-rent-reference.mjs
      - name: Commit changed official data
        run: |
          if git diff --quiet -- rent-reference.json design-preview/public/rent-reference.json; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add rent-reference.json design-preview/public/rent-reference.json
          git commit -m 'Update TÜİK rent reference'
          git push
