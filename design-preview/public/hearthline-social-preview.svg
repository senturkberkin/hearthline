<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="title desc">
  <title id="title">Hearthline — Rent versus buy planner</title>
  <desc id="desc">A private, browser-based planning aid for comparing renting and buying with your own assumptions.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#edf4ff"/>
      <stop offset="1" stop-color="#f8fafc"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="20" stdDeviation="20" flood-color="#174070" flood-opacity=".14"/>
    </filter>
  </defs>
  <rect width="1200" height="630" fill="url(#bg)"/>
  <circle cx="1082" cy="-14" r="220" fill="#dcecff"/>
  <circle cx="1102" cy="606" r="172" fill="#e5f0ff"/>
  <g transform="translate(86 78)">
    <circle cx="34" cy="34" r="32" fill="#1b68c8"/>
    <path d="M15 27 34 11l19 16" fill="none" stroke="#8fc0ec" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M21 37v18m26-18v18M21 46h26" fill="none" stroke="#fff" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="84" y="43" fill="#173f70" font-family="Arial, Helvetica, sans-serif" font-size="35" font-weight="700" letter-spacing="-1.3">Hearthline</text>
  </g>
  <text x="86" y="220" fill="#173f70" font-family="Arial, Helvetica, sans-serif" font-size="68" font-weight="700" letter-spacing="-3">Kira mı, ev almak mı?</text>
  <text x="86" y="284" fill="#173f70" font-family="Arial, Helvetica, sans-serif" font-size="42" font-weight="600" letter-spacing="-1.5">Rent vs. buy, on your terms.</text>
  <text x="86" y="350" fill="#496079" font-family="Arial, Helvetica, sans-serif" font-size="27">Kendi varsayımlarınla nakit akışını karşılaştır.</text>
  <text x="86" y="389" fill="#496079" font-family="Arial, Helvetica, sans-serif" font-size="27">Compare cash flow using your own assumptions.</text>
  <g transform="translate(86 300)" filter="url(#shadow)">
    <rect width="724" height="92" rx="20" fill="#fff"/>
    <circle cx="42" cy="46" r="13" fill="#1b68c8"/>
    <path d="m36 46 5 5 9-11" fill="none" stroke="#fff" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="76" y="38" fill="#173f70" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="700">Senin senaryon, piyasa tahmini değil.</text>
    <text x="76" y="66" fill="#496079" font-family="Arial, Helvetica, sans-serif" font-size="18">Your scenario, not a market prediction.</text>
  </g>
</svg>
