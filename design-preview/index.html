<!doctype html>
<html lang="tr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#ffffff" />
    <meta name="description" content="Kirada kalmayı ve ev almayı kendi varsayımlarınla karşılaştır. Senin senaryon, piyasa tahmini değil." />
    <title>Hearthline — Senin senaryon, piyasa tahmini değil</title>
    <script>try { const s = JSON.parse(localStorage.getItem('hearthline.settings.v1') || 'null'); if (s?.theme === 'dark') document.documentElement.classList.add('dark'); if (s?.language === 'en') document.documentElement.lang = 'en'; } catch {}</script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
